<div class="home-shell min-h-[calc(100vh-4rem)] w-full max-w-2xl mx-auto px-4 py-8 flex flex-col justify-center">
  <section class="home-card">
  <div class="home-mark" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none"><path d="M9 34h30M13 34V15a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3v19M16 20h16M18 29h.01M30 29h.01M19 12V8m10 4V8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 38h.01M32 38h.01" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
  </div>
  <div class="text-center mb-8">
    <h1 class="heading-primary home-title text-2xl mb-2">
      {{ 'homepage.welcome' | translate }}
    </h1>
    
    <p class="text-muted">
      {{ 'homepage.chooseSearchType' | translate }}
    </p>
  </div>

  <div class="flex flex-col gap-3">
    <button (click)="goToLine()" class="btn-primary home-action w-full">
      {{ 'homepage.searchByLine' | translate }}
    </button>
    <button (click)="goToStop()" class="btn-secondary home-action w-full">
      {{ 'homepage.searchByStop' | translate }}
    </button>
    <button (click)="goToNearby()" class="btn-secondary home-action nearby-action w-full">
      {{ 'homepage.nearbyStops' | translate }}
    </button>
  </div>
  </section>
</div>
