<div class="min-h-[calc(100vh-4rem)] w-full max-w-2xl mx-auto px-4 py-8 flex flex-col justify-center">
  <div class="text-center mb-8">
    <h2 class="heading-primary text-2xl mb-2">
      {{ 'homepage.welcome' | translate }}
    </h2>

    <p class="text-muted">
      {{ 'homepage.chooseSearchType' | translate }}
    </p>
  </div>

  <div class="flex flex-col gap-4">
    <button (click)="goToLine()" class="card w-full text-left cursor-pointer">
      <div class="flex items-center justify-between gap-4">
        <div>
          <div class="text-base font-semibold text-main mb-1">
            {{ 'homepage.searchByLine' | translate }}
          </div>
          <div class="text-sm text-muted">
            {{ 'nav.searchByLine' | translate }}
          </div>
        </div>
        <svg class="w-6 h-6 text-secondary-var shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
    </button>

    <button (click)="goToStop()" class="card w-full text-left cursor-pointer">
      <div class="flex items-center justify-between gap-4">
        <div>
          <div class="text-base font-semibold text-main mb-1">
            {{ 'homepage.searchByStop' | translate }}
          </div>
          <div class="text-sm text-muted">
            {{ 'nav.searchByStop' | translate }}
          </div>
        </div>
        <svg class="w-6 h-6 text-secondary-var shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
    </button>

    <button (click)="goToNearby()" class="card w-full text-left cursor-pointer">
      <div class="flex items-center justify-between gap-4">
        <div>
          <div class="text-base font-semibold text-main mb-1">
            {{ 'homepage.nearbyStops' | translate }}
          </div>
          <div class="text-sm text-muted">
            {{ 'nearby.title' | translate }}
          </div>
        </div>
        <svg class="w-6 h-6 text-secondary-var shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
    </button>
  </div>
</div>
